<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    background: #111;
    color: #eee;
    padding: 16px;
    margin: 0;
  }
  h2 { font-size: 1.2rem; margin-bottom: 16px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  .item img,
  .item video {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    cursor: pointer;
  }
  .item a.filename {
    color: #eee;
    text-decoration: none;
    font-size: 0.8rem;
    word-break: break-word;
  }
  .item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .item .icon {
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: 20%;
    border-radius: 8px;
    background: #1c1c1c;
    display: block;
  }
  .sort-toggle a, u {
    text-decoration: none;
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    body { padding: 10px; }
  }
  @media (min-width: 1200px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.84);
    z-index: 1000;
    touch-action: pan-y;
    user-select: none;
    padding: 32px;
  }
  #lightbox.open { display: flex; align-items: center; justify-content: center; }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #lightbox video { max-width: 100%; max-height: 100%; }
  #lightbox .close {
    position: absolute;
    top: 16px; right: 20px;
    font-size: 2rem;
    color: #eee;
    cursor: pointer;
    z-index: 1001;
  }
  #lightbox-img { transition: transform 0.15s ease; cursor: zoom-in; }
  #lightbox-img.zoomed { object-fit: none; max-width: none; max-height: none; cursor: zoom-out; }
  #lightbox .nav {
    position: absolute;
    top: 0; bottom: 0;
    width: 25%;
    display: flex;
    align-items: center;
    font-size: 2.5rem;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    user-select: none;
  }
  #lightbox .prev { left: 0; justify-content: flex-start; padding-left: 12px; }
  #lightbox .next { right: 0; justify-content: flex-end; padding-right: 12px; }
  #lightbox .name {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.9rem;
    color: #eee;
    z-index: 1001;
  }

</style>
</head>
<body>
<h2>{{.Title}}</h2>

<div class="sort-toggle">
  Sort by:
  <a href="?sort=name" class="{{if ne .Sort "date"}}active{{end}}">Name</a>
  ·
  <a href="?sort=date" class="{{if eq .Sort "date"}}active{{end}}">Date</a>
</div>

<div class="grid">
{{range $i, $f := .Files}}
  <div class="item">
    {{if $f.IsDir}}
      <a href="{{$f.Name}}/">
        <svg viewBox="0 0 24 24" class="icon" fill="#e8b84b"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      </a>
    {{else if $f.IsImage}}
      <img src="{{$f.Name}}" loading="lazy" onclick="openLightbox('{{$f.Name}}')">
    {{else if $f.IsVideo}}
      <img src="/thumbs/{{$f.Name}}.jpg" muted onclick="openLightbox('{{$f.Name}}')">
    {{end}}
    <a class="filename" href="{{$f.Name}}">{{$f.Name}}</a>
  </div>
{{end}}
</div>

<div id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <div class="nav prev" onclick="navigate(-1)">&#10094;</div>
  <img id="lightbox-img" src="">
  <video id="lightbox-video" controls></video>
  <div class="nav next" onclick="navigate(1)">&#10095;</div>
  <span class="name" id="lightbox-name"></span>
</div>

<script>
  const items = {{.ItemsJSON}};
  let currentIndex = 0;
  let zoomed = false;

  const lbImg = document.getElementById('lightbox-img');
  lbImg.addEventListener('dblclick', () => {
    zoomed = !zoomed;
    lbImg.classList.toggle('zoomed', zoomed);
  });
  lbImg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY < 0 ? 1.1 : 0.9;
    const current = lbImg.style.transform.match(/scale\(([\d.]+)\)/);
    const newScale = Math.max(1, (current ? parseFloat(current[1]) : 1) * scale);
    lbImg.style.transform = 'scale(' + newScale + ')';
  });

  function openLightbox(name) {
    currentIndex = items.findIndex(i => i.name === name);
    updateImage();
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-video').pause();
  }
  function updateImage() {
    const item = items[currentIndex];
    const img = document.getElementById('lightbox-img');
    const vid = document.getElementById('lightbox-video');
    vid.pause();
    if (item.video) {
      img.style.display = 'none';
      vid.style.display = 'block';
      vid.src = item.name;
      vid.play();
    } else {
      vid.style.display = 'none';
      img.style.display = 'block';
      img.src = item.name;
    }
    document.getElementById('lightbox-name').textContent = item.name;
  }
  function navigate(dir) {
    currentIndex = (currentIndex + dir + items.length) % items.length;
    updateImage();
  }

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'Escape') closeLightbox();
  });

  let touchStartX = 0;
  const lb = document.getElementById('lightbox');
  lb.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  });
  lb.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
  });
</script>
</body>
</html>
