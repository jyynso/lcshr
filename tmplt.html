<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgZmlsbD0iI2ZjZjdmNyIgdmlld0JveD0iMCAwIDI1NiAyNTYiPjxwYXRoIGQ9Ik0xMjgsMjRBMTA0LDEwNCwwLDEsMCwyMzIsMTI4LDEwNC4xMSwxMDQuMTEsMCwwLDAsMTI4LDI0Wm0wLDE5MmE4OCw4OCwwLDEsMSw4OC04OEE4OC4xLDg4LjEsMCwwLDEsMTI4LDIxNlpNODAsMTA4YTEyLDEyLDAsMSwxLDEyLDEyQTEyLDEyLDAsMCwxLDgwLDEwOFptMTA0LDBhOCw4LDAsMCwxLTgsOEgxNTJhOCw4LDAsMCwxLDAtMTZoMjRBOCw4LDAsMCwxLDE4NCwxMDhabS05LjA4LDQ4Yy0xMC4yOSwxNy43OS0yNy4zOSwyOC00Ni45MiwyOHMtMzYuNjMtMTAuMi00Ni45My0yOGE4LDgsMCwxLDEsMTMuODYtOGM3LjQ2LDEyLjkxLDE5LjIsMjAsMzMuMDcsMjBzMjUuNjEtNy4xLDMzLjA4LTIwYTgsOCwwLDEsMSwxMy44NCw4WiI+PC9wYXRoPjwvc3ZnPg=="/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #17171a;
    --border: #2a2a2e;
    --text: #ececec;
    --text-dim: #8a8a92;
    --accent: #b8bb26;
    --folder: #e8b84b;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  h2 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .crumb { color: var(--text); text-decoration: none; }
  .crumb:hover { color: var(--accent); }
  .crumb-sep { color: var(--text-dim); margin: 0 2px; }

  .sort-toggle {
    font-size: 0.85rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sort-toggle a {
    color: var(--text-dim);
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sort-toggle a:hover { color: var(--text); background: var(--panel); }
  .sort-toggle a.active {
    color: var(--bg);
    background: var(--accent);
    font-weight: 600;
  }
  .sort-toggle .sep { display: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .item img,
  .item video,
  .item .icon {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: var(--radius);
    display: block;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--border);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .item img:hover,
  .item .icon:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .item .icon {
    padding: 22%;
    cursor: default;
  }
  .item .icon:hover { transform: none; border-color: var(--border); }
  a:has(> .icon) { text-decoration: none; }

  .item a.filename {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.78rem;
    word-break: break-word;
    line-height: 1.3;
    padding: 0 2px;
  }
  .item a.filename:hover { color: var(--text); }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    body { padding: 14px; }
    header { flex-direction: column; align-items: flex-start; }
  }
  @media (min-width: 1200px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }

  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    touch-action: pan-y;
    user-select: none;
    padding: 32px;
  }
  #lightbox.open { display: flex; align-items: center; justify-content: center; }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  #lightbox video { max-width: 100%; max-height: 100%; }
  #lightbox .close {
    position: absolute;
    top: 20px; right: 24px;
    font-size: 2rem;
    color: var(--text);
    cursor: pointer;
    z-index: 1001;
    opacity: 0.7;
    transition: opacity 0.15s ease;
  }
  #lightbox .close:hover { opacity: 1; }
  #lightbox-img { transition: transform 0.15s ease; cursor: zoom-in; }
  #lightbox-img.zoomed { object-fit: none; max-width: none; max-height: none; cursor: zoom-out; }
  #lightbox .nav {
    position: absolute;
    top: 0; bottom: 0;
    width: 25%;
    display: flex;
    align-items: center;
    font-size: 2.5rem;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    user-select: none;
    transition: color 0.15s ease;
  }
  #lightbox .nav:hover { color: rgba(255,255,255,0.9); }
  #lightbox .prev { left: 0; justify-content: flex-start; padding-left: 12px; }
  #lightbox .next { right: 0; justify-content: flex-end; padding-right: 12px; }
  #lightbox .name {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-dim);
    z-index: 1001;
  }
</style>
</head>
<body>
<header>
  <h2>
    <a href="/" class="crumb">{{.Title}}</a>
    {{range .Breadcrumbs}}
      <span class="crumb-sep">/</span>
      <a href="{{.Path}}/" class="crumb">{{.Name}}</a>
    {{end}}
  </h2>
  <div class="sort-toggle">
    Sort:
    <a href="?sort=name" class="{{if ne .Sort "date"}}active{{end}}">Name</a>
    <a href="?sort=date" class="{{if eq .Sort "date"}}active{{end}}">Date</a>
  </div>
</header>

<div class="grid">
{{range $i, $f := .Files}}
  <div class="item">
    {{if $f.IsDir}}
      <a href="{{$f.Name}}/">
        <svg viewBox="0 0 24 24" class="icon" fill="var(--folder)"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      </a>
    {{else if $f.IsImage}}
      <img src="{{$f.Name}}" loading="lazy" onclick="openLightbox('{{$f.Name}}')">
    {{else if $f.IsVideo}}
      <img src="/thumbs/{{$f.Name}}.jpg" muted onclick="openLightbox('{{$f.Name}}')">
    {{else}}
      <a href="{{$f.Name}}">
        <svg viewBox="0 0 24 24" class="icon" fill="var(--text-dim)"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5z"/></svg>
      </a>
    {{end}}
    <a class="filename" href="{{$f.Name}}{{if $f.IsDir}}/{{end}}">{{$f.Name}}</a>
  </div>
{{end}}
</div>

<div id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <div class="nav prev" onclick="navigate(-1)">&#10094;</div>
  <img id="lightbox-img" src="">
  <video id="lightbox-video" controls></video>
  <div class="nav next" onclick="navigate(1)">&#10095;</div>
  <span class="name" id="lightbox-name"></span>
</div>

<script>
  const items = {{.ItemsJSON}};
  let currentIndex = 0;
  let zoomed = false;

  const lbImg = document.getElementById('lightbox-img');
  lbImg.addEventListener('dblclick', () => {
    zoomed = !zoomed;
    lbImg.classList.toggle('zoomed', zoomed);
  });
  lbImg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY < 0 ? 1.1 : 0.9;
    const current = lbImg.style.transform.match(/scale\(([\d.]+)\)/);
    const newScale = Math.max(1, (current ? parseFloat(current[1]) : 1) * scale);
    lbImg.style.transform = 'scale(' + newScale + ')';
  });

  function openLightbox(name) {
    currentIndex = items.findIndex(i => i.name === name);
    updateImage();
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-video').pause();
  }
  function updateImage() {
    const item = items[currentIndex];
    const img = document.getElementById('lightbox-img');
    const vid = document.getElementById('lightbox-video');
    vid.pause();
    if (item.video) {
      img.style.display = 'none';
      vid.style.display = 'block';
      vid.src = item.name;
      vid.play();
    } else {
      vid.style.display = 'none';
      img.style.display = 'block';
      img.src = item.name;
    }
    document.getElementById('lightbox-name').textContent = item.name;
  }
  function navigate(dir) {
    currentIndex = (currentIndex + dir + items.length) % items.length;
    updateImage();
  }

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'Escape') closeLightbox();
  });

  let touchStartX = 0;
  const lb = document.getElementById('lightbox');
  lb.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  });
  lb.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
  });
</script>
</body>
</html>
